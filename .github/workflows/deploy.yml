name: Deploy to Hostinger

on:
  push:
    branches:
      - main

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build

      - name: 📂 Sync files via FTP
        timeout-minutes: 10
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          echo "[$(date)] Checking dist directory..."
          ls -la dist/ | head -20
          echo "[$(date)] Starting FTP upload..."
          timeout --signal=TERM 300 lftp -u $FTP_USERNAME,$FTP_PASSWORD -p 21 $FTP_HOST << EOF
          set ssl:verify-certificate no
          set ftp:passive-mode true
          set net:timeout 60
          set net:max-retries 3
          set net:reconnect-interval-base 3
          set net:reconnect-interval-max 10
          mirror -R --verbose dist/ /
          bye
          EOF
          EXIT_CODE=$?
          if [ $EXIT_CODE -eq 124 ]; then
            echo "ERROR: FTP upload timed out after 5 minutes"
            exit 1
          elif [ $EXIT_CODE -ne 0 ]; then
            echo "ERROR: FTP upload failed with exit code $EXIT_CODE"
            exit $EXIT_CODE
          fi
          echo "[$(date)] FTP upload completed successfully"
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
